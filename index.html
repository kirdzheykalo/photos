<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Фото">
<meta name="theme-color" content="#ffffff">
<title>Фото</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#fff;--fg:#000;--mut:#8a8a8e;--bar:rgba(249,249,249,.88);--acc:#007aff;--cell:#e5e5ea;--line:rgba(60,60,67,.2);color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#fff;--bar:rgba(28,28,30,.88);--cell:#1c1c1e;--line:rgba(84,84,88,.6)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{padding-top:env(safe-area-inset-top,0px);overflow:hidden}
main{height:100%;overflow-y:auto;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
section[hidden],#v[hidden]{display:none}
h1{font-size:34px;font-weight:700;letter-spacing:-.4px;margin:8px 16px 2px}
.sub{color:var(--mut);font-size:15px;margin:0 16px 10px}
h3{font-size:15px;font-weight:600;margin:14px 16px 6px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
@media(min-width:700px){.g{grid-template-columns:repeat(6,1fr)}}
.c{position:relative;aspect-ratio:1;background:var(--cell);overflow:hidden}
.c img{width:100%;height:100%;object-fit:cover;display:block}
.c i{position:absolute;right:5px;bottom:4px;color:#fff;font-style:normal;font-size:12px;text-shadow:0 0 4px rgba(0,0,0,.6)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--mut);font:600 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 28px}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--acc)}
.pad{padding:0 16px}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;font:600 17px inherit;font-family:inherit;padding:15px;margin:10px 0}
.btn.alt{background:var(--cell);color:var(--acc)}
input[type=text]{width:100%;font:16px inherit;font-family:inherit;padding:13px;border-radius:12px;border:.5px solid var(--line);background:var(--cell);color:var(--fg)}
.bar{height:6px;border-radius:3px;background:var(--cell);overflow:hidden;margin:12px 0}
.bar b{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
p.t{color:var(--mut);font-size:14px;line-height:1.45}
ol{color:var(--mut);font-size:14px;line-height:1.5;padding-left:20px}
#v{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;color:#fff}
#m{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#m img,#m video{max-width:100%;max-height:100%;object-fit:contain}
#top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
#top button{background:rgba(255,255,255,.18);border:0;color:#fff;font-size:20px;width:36px;height:36px;border-radius:18px}
#cap{font-size:15px;font-weight:600}
</style>
</head>
<body>
<main>
<section id="lib" hidden>
  <h1>Медиатека</h1>
  <p class="sub" id="cnt"></p>
  <div id="grid"></div>
</section>
<section id="up" hidden class="pad">
  <h1 style="margin-left:0">Загрузка</h1>
  <p class="t">Выберите фото и видео из галереи. Чтобы загрузить всё, откройте «Выбрать всё» в системном окне. Файлы, которые уже есть в папке «Мои фото», пропускаются.</p>
  <button class="btn" id="pick">Выбрать фото и видео</button>
  <input type="file" id="file" multiple accept="image/*,video/*" hidden>
  <div class="bar"><b id="b1"></b></div>
  <p class="t" id="st"></p>
  <button class="btn alt" id="out">Выйти из аккаунта</button>
</section>
<section id="login" class="pad">
  <h1 style="margin-left:0">Фото</h1>
  <p class="t">Ваши фото хранятся в Google Диске, в папке «Мои фото».</p>
  <div id="setup">
    <p class="t">Один раз вставьте OAuth Client ID из Google Cloud:</p>
    <input type="text" id="cid" placeholder="123456-abc.apps.googleusercontent.com" autocapitalize="off" autocorrect="off">
  </div>
  <button class="btn" id="go">Войти через Google</button>
  <p class="t" id="err"></p>
</section>
</main>
<nav id="nav" hidden>
  <button data-t="lib" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>Медиатека</button>
  <button data-t="up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>Загрузка</button>
</nav>
<div id="v" hidden>
  <div id="top"><button id="x" aria-label="Закрыть">✕</button><span id="cap"></span><span style="width:36px"></span></div>
  <div id="m"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const API='https://www.googleapis.com/drive/v3/';
let CID=localStorage.cid||'',tok=localStorage.tk||'',exp=+localStorage.ex||0,folder=null,items=[],cur=0,bu=null;

function auth(){
  return new Promise((res,rej)=>{
    if(!window.google)return rej(new Error('Скрипт Google ещё не загрузился, повторите через секунду'));
    google.accounts.oauth2.initTokenClient({
      client_id:CID,scope:'https://www.googleapis.com/auth/drive.file',
      callback:r=>{if(r.error)return rej(new Error(r.error));tok=r.access_token;exp=Date.now()+r.expires_in*1000-60000;localStorage.tk=tok;localStorage.ex=exp;res()},
      error_callback:e=>rej(new Error(e.type||'Вход отменён'))
    }).requestAccessToken({prompt:''});
  });
}
async function T(){if(!tok||Date.now()>exp)await auth();return tok}
async function g(u,o={}){
  const t=await T();o.headers={...o.headers,Authorization:'Bearer '+t};
  const r=await fetch(u,o);
  if(r.status===401){exp=0;throw new Error('Сессия истекла, войдите снова')}
  if(!r.ok)throw new Error('Ошибка Google Диска: '+r.status);
  return r;
}
async function getFolder(){
  const q=encodeURIComponent("name='Мои фото' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  let j=await(await g(API+'files?q='+q+'&fields=files(id)')).json();
  if(j.files[0])return j.files[0].id;
  j=await(await g(API+'files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Мои фото',mimeType:'application/vnd.google-apps.folder'})})).json();
  return j.id;
}
async function load(){
  folder=await getFolder();items=[];let pt='';
  const q=encodeURIComponent(`'${folder}' in parents and trashed=false and (mimeType contains 'image/' or mimeType contains 'video/')`);
  do{
    const j=await(await g(API+`files?q=${q}&orderBy=createdTime desc&pageSize=1000&fields=nextPageToken,files(id,name,mimeType,size,createdTime,thumbnailLink)`+(pt?'&pageToken='+pt:''))).json();
    items.push(...j.files);pt=j.nextPageToken;
  }while(pt);
  render();
}
const thumb=f=>f.thumbnailLink?f.thumbnailLink.replace(/=s\d+$/,'=s400'):'';
const day=f=>new Date(f.createdTime).toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'});
function render(){
  let h='',d='';
  items.forEach((f,i)=>{
    const k=day(f);
    if(k!==d){h+=(d?'</div>':'')+`<h3>${k}</h3><div class="g">`;d=k}
    h+=`<div class="c" data-i="${i}"><img loading="lazy" alt="" src="${thumb(f)}" onerror="fb(this,${i})">${f.mimeType.startsWith('video')?'<i>▶</i>':''}</div>`;
  });
  $('#grid').innerHTML=h+(d?'</div>':'');
  $('#cnt').textContent=items.length?`${items.length} объектов`:'Пока пусто. Загрузите фото на вкладке «Загрузка».';
}
async function fb(img,i){
  if(img.dataset.f||items[i].mimeType.startsWith('video'))return;img.dataset.f=1;
  try{const b=await(await g(API+'files/'+items[i].id+'?alt=media')).blob();img.src=URL.createObjectURL(b)}catch(e){}
}
$('#grid').onclick=e=>{const c=e.target.closest('.c');if(c){cur=+c.dataset.i;show()}};
async function show(){
  const f=items[cur],id=cur,m=$('#m');
  $('#v').hidden=false;$('#cap').textContent=day(f);m.innerHTML='<p>Загрузка…</p>';
  try{
    const b=await(await g(API+'files/'+f.id+'?alt=media')).blob();
    if(id!==cur)return;
    if(bu)URL.revokeObjectURL(bu);bu=URL.createObjectURL(b);
    m.innerHTML=f.mimeType.startsWith('video')?`<video src="${bu}" controls playsinline autoplay></video>`:`<img src="${bu}" alt="">`;
  }catch(e){m.textContent='Не удалось открыть файл'}
}
function step(n){const k=cur+n;if(k>=0&&k<items.length){cur=k;show()}}
$('#x').onclick=()=>{$('#v').hidden=true;$('#m').innerHTML=''};
let sx=0;
$('#m').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('#m').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(d>70)step(-1);else if(d<-70)step(1)});

// Загрузка
function send(f){
  return T().then(async t=>{
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable',{
      method:'POST',
      headers:{Authorization:'Bearer '+t,'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':f.type||'application/octet-stream'},
      body:JSON.stringify({name:f.name,parents:[folder],createdTime:new Date(f.lastModified).toISOString()})
    });
    if(!r.ok)throw new Error('start '+r.status);
    const u=r.headers.get('Location');
    await new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('PUT',u);x.onload=()=>x.status<300?res():rej(new Error('put '+x.status));x.onerror=()=>rej(new Error('network'));x.send(f)});
  });
}
async function upload(list){
  const have=new Set(items.map(f=>f.name+'|'+f.size));
  let ok=0,skip=0,fail=0;
  for(let n=0;n<list.length;n++){
    const f=list[n];
    $('#st').textContent=`Загрузка ${n+1} из ${list.length}…`;
    if(have.has(f.name+'|'+f.size)){skip++}
    else{try{await send(f);ok++}catch(e){fail++;if(/Сессия|Вход|Скрипт/.test(e.message)){$('#st').textContent=e.message;break}}}
    $('#b1').style.width=((n+1)/list.length*100)+'%';
  }
  $('#st').textContent=`Готово. Загружено: ${ok}, пропущено: ${skip}`+(fail?`, ошибок: ${fail}. Выберите те же файлы ещё раз, загрузятся только недостающие.`:'.');
  await load();
}
$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const l=[...e.target.files];e.target.value='';if(l.length){$('#b1').style.width='0';upload(l).catch(x=>$('#st').textContent=x.message)}};

// Навигация и вход
function tab(t){
  ['lib','up'].forEach(s=>$('#'+s).hidden=s!==t);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('main').scrollTop=0;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
function enter(){$('#login').hidden=true;$('#nav').hidden=false;tab('lib')}
async function start(){
  $('#err').textContent='';
  const v=$('#cid').value.trim();if(v){CID=v;localStorage.cid=v}
  if(!CID){$('#err').textContent='Вставьте Client ID';return}
  try{await T();await load();enter()}catch(e){$('#err').textContent=e.message||'Не удалось войти'}
}
$('#go').onclick=start;
$('#out').onclick=()=>{localStorage.removeItem('tk');localStorage.removeItem('ex');tok='';exp=0;location.reload()};
if(CID){$('#setup').hidden=true;$('#cid').value=CID}
if(CID&&tok&&Date.now()<exp){load().then(enter).catch(()=>{})}
</script>
</body>
</html>
